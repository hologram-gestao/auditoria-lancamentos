name: WIF smoke (projeto novo)

# TEMPORÁRIO: este arquivo é removido pela subtask 5 do épico 86e3r2egb (86e3r2ehn),
# quando os workflows de deploy passarem a apontar para o projeto novo.
#
# Prova, antes do corte, que o GitHub Actions autentica no projeto hologramos-512320 pelo
# Workload Identity que o scripts/deploy/setup_wif.sh criou. Usa secrets com sufixo _NEW
# para não tocar nos GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_API_SERVICE_ACCOUNT que o
# deploy atual (projeto antigo) usa. Só LÊ: não faz build nem deploy.
#
# Valores dos secrets (impressos no fim do setup_wif.sh):
#   GCP_WORKLOAD_IDENTITY_PROVIDER_NEW = projects/<número>/locations/global/workloadIdentityPools/auditoria-github-pool/providers/auditoria-github-provider
#   GCP_API_SERVICE_ACCOUNT_NEW        = auditoria-api-sa@hologramos-512320.iam.gserviceaccount.com

on:
  workflow_dispatch:

concurrency:
  group: wif-smoke
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF

jobs:
  smoke:
    name: Autenticar no projeto novo e listar serviços
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Auth GCP (WIF, projeto novo)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_NEW }}
          service_account: ${{ secrets.GCP_API_SERVICE_ACCOUNT_NEW }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Projeto alcançável
        run: gcloud projects describe hologramos-512320 --format='value(projectId,projectNumber,lifecycleState)'

      - name: Cloud Run alcançável
        run: gcloud run services list --region southamerica-east1 --project hologramos-512320
